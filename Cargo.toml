[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Render the Mandelbrot set to a blocky terminal picture or a deterministic PNG"
license = "MIT"


[[bin]]
name = "mandelbrot"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Rendering is conversion between pixel counts and real coordinates, so these
# casts are the domain rather than a hazard: indices here are bounded by the
# grid the caller asked for, and every widening is exact for the magnitudes
# involved (an image dimension fits far inside f64's 53-bit mantissa).
# Silencing them per-use would bury the handful of casts that *do* narrow
# unsafely, which are individually annotated in src/escape.rs and src/palette.rs.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
missing_docs_in_private_items = "allow"
